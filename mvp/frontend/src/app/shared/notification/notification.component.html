<!-- Toast Notifications Container -->
<div class="fixed top-4 right-4 z-[9999] space-y-3 max-w-md">
  @for (notification of notifications; track notification.id) {
    <div 
      class="notification-toast rounded-lg border-2 shadow-lg p-4 flex items-start gap-3 animate-slide-in"
      [ngClass]="getBgClass(notification.type)"
    >
      <div class="flex-shrink-0 mt-0.5">
        <i [ngClass]="getIconClass(notification.type)" class="text-xl"></i>
      </div>
      
      <div class="flex-1 min-w-0">
        <h4 class="font-semibold text-gray-900 text-sm">{{ notification.title }}</h4>
        <p class="text-gray-700 text-sm mt-1">{{ notification.message }}</p>
      </div>
      
      <button 
        (click)="removeNotification(notification.id)"
        class="flex-shrink-0 text-gray-400 hover:text-gray-600 transition-colors"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>
  }
</div>

<!-- Confirm Dialog Modal -->
@if (confirmDialog$ | async; as dialog) {
  <div class="fixed inset-0 z-[10000] flex items-center justify-center">
    <!-- Backdrop -->
    <div 
      class="absolute inset-0 bg-black bg-opacity-50 transition-opacity animate-fade-in"
      (click)="closeDialog()"
    ></div>
    
    <!-- Dialog -->
    <div class="relative bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 animate-scale-in">
      <!-- Header -->
      <div class="px-6 py-4 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <h3 class="text-xl font-bold text-gray-900">{{ dialog.title }}</h3>
          <button 
            (click)="closeDialog()"
            class="text-gray-400 hover:text-gray-600 transition-colors"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      
      <!-- Body -->
      <div class="px-6 py-4">
        <p class="text-gray-700">{{ dialog.message }}</p>
      </div>
      
      <!-- Footer -->
      <div class="px-6 py-4 bg-gray-50 rounded-b-xl flex justify-end gap-3">
        <button
          (click)="onCancel()"
          class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 font-medium transition-colors"
        >
          {{ dialog.cancelText || 'Cancel' }}
        </button>
        <button
          (click)="onConfirm()"
          class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium transition-colors"
        >
          {{ dialog.confirmText || 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
}
